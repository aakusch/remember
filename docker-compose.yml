services:
  remember:
    build: .
    image: remember:local
    container_name: remember
    restart: unless-stopped
    # The CLI + agent API listens on 4320.
    ports:
      - "127.0.0.1:4320:4320"
    volumes:
      # Mount your wiki content + config. Edit ./my-wiki on the host; container reads/writes it.
      - ./my-wiki:/wiki
    environment:
      # Bind on 0.0.0.0 inside the container; the port forward above
      # restricts external access to 127.0.0.1 by default.
      REMEMBER_HOST: 0.0.0.0
      REMEMBER_API_PORT: "4320"
      # REQUIRED, not optional. The container binds 0.0.0.0 (it has to — a
      # loopback bind inside a container is unreachable from the host), and the
      # server cowardly refuses a non-loopback bind with no token. Defaulting
      # this to empty meant `docker compose up` exited immediately with
      # "Cowardly refusing to bind to 0.0.0.0" on a stock checkout — the compose
      # file shipped in a state where it could not start.
      #
      # Generate one:  export REMEMBER_ADMIN_TOKEN=$(openssl rand -base64 32)
      REMEMBER_ADMIN_TOKEN: ${REMEMBER_ADMIN_TOKEN:?set REMEMBER_ADMIN_TOKEN — see the comment above}
      # Optional: switches the embedder to OpenAI if set.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4320/v1/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
