name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads pnpm@9.0.0 from package.json. Supplying a
      # second version here is a hard error in action-setup v4.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The viewer resolves @useremember/core through its package exports,
      # whose types live in dist/. A clean CI checkout must build that
      # dependency before Astro performs its strict check.
      - run: pnpm --filter @useremember/core build
      - run: pnpm typecheck
      - run: pnpm test
