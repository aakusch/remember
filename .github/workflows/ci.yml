name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads pnpm@9.0.0 from package.json. Supplying a
      # second version here is a hard error in action-setup v4.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the core package (emits dist/) before typecheck + tests so the
      # published entrypoints and .d.ts are in place.
      - run: pnpm --filter @useremember/core build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Deterministic retrieval benchmark
        run: >-
          pnpm --filter @useremember/core benchmark --
          --profile ci
          --compare ../../benchmarks/results/remember-v0.0.1-ci-hash.json
          --fail-on-regression
          --output "$RUNNER_TEMP/remember-retrieval-ci.json"
